[experiment]
seed = 1234

[training]
dataset_path = ./data
save_dir = ./results/FGAF-Net_BlindPixel_stage1_mix640
# Stage1 does not need a pretrained stage1 dir; keep empty for clarity.
stage1_pretrained_dir =
log_dir = ./results/log_dir

gpu = 0
nThreads = 12
batch_size = 4

# Stage1 schedule
lr = 0.0001
lr_drop_epoch = 200
lr_after_drop = 0.00005
lr_dynamic_after_drop = True
dynamic_min_lr = 0.000001
num_epochs = 400
finetuning = False
need_patch = True
save_train_img = False
patch_size = 128
scale = 1
stage = 1
num_seq = 5

# mixed precision and runtime knobs
use_amp = True
amp_dtype = bf16
cudnn_benchmark = True
cuda_launch_blocking = False
pin_memory = True
persistent_workers = True
prefetch_factor = 2
grad_clip_norm = 0.5

amp_init_scale = 1024
amp_growth_interval = 12000
amp_backoff_factor = 0.5
overflow_patience = 2
lr_overflow_decay = 0.7
min_lr = 0.0000005
overflow_lr_decay_cooldown = 80
overflow_log_interval = 20
amp_recovery_steps = 256

checkpoint_psnr_tolerance = 0.0001
checkpoint_blind_l1_tolerance = 0.000001

[network]
in_channels = 1
dim = 80
ds_kernel_size = 3
us_kernel_size = 3
num_RDB = 16
growth_rate = 18
num_dense_layer = 4
num_flow = 5
num_FRMA = 3
num_transformer_block = 2
num_heads = 5
LayerNorm_type = WithBias
ffn_expansion_factor = 2.66
bias = True

[validation]
val_period = 5

[fusion]
# Used by BRNet / inference path; harmless in Stage1 and kept for compatibility.
base_alpha = 0.6238
base_beta = 0.7209
blind_res_scale = 1.018
blind_infer_threshold = 0.10

[test]
custom_path = ./data/test_blur
# Optional legacy single-seq CSV; per-seq logic in train.py will auto-detect test_mask/<seq>/
test_mask_csv = ./data/test_mask/001/blind_pixel_coords.csv

[loss]
# Common weights (Stage1 uses recon/hr_warp/flow/D_TA path).
lr_warping_loss_weight = 0.1
hr_warping_loss_weight = 0.1
flow_loss_weight = 0.1
D_TA_loss_weight = 0.1
R_TA_loss_weight = 0.1
BDNet_weight = 0.1
blind_restore_loss_weight = 0.6
blind_res_loss_weight = 2.0
blind_mask_threshold = 0.025
flow_loss_scale = 10.0
smart_blind_l2_scale = 1000.0
smart_blind_topk_frac = 0.005
restoration_loss_weight = 1.0
blind_boundary_loss_weight = 1.0
blind_gate_tv_weight = 0.01
blind_gate_sparsity_weight = 0.0
boundary_dilate = 3

