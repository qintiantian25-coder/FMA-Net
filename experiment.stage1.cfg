[experiment]
seed = 1234

[training]
dataset_path = ./data
save_dir = ./results/FMA-Net_BlindPixel_stage1
stage1_pretrained_dir =
log_dir = ./results/log_dir

gpu = 0
# RTX 6000 Pro 48GB: Stage1 仅 Net_D
# 实测 batch=6 peak=17.7GB, batch=8 OOM(可能碎片化)
nThreads = 16
batch_size = 6

# === Stage1 LR 调度 ===
# 从头训练：大 LR 快速收敛 → 200 epoch 后 cosine 退火到 dynamic_min_lr
lr = 0.0001
lr_drop_epoch = 200
lr_after_drop = 0.0001
lr_dynamic_after_drop = True
dynamic_min_lr = 0.000001
num_epochs = 400
finetuning = False
need_patch = True
save_train_img = False
patch_size = 128
scale = 1
stage = 1
num_seq = 5

# === 训练策略 ===
warmup_epochs = 5
# torch.compile 与模型内部 backwarp 缓存字典冲突，暂关闭
use_compile = False
grad_accum_steps = 1

# === 混合精度 ===
use_amp = True
amp_dtype = bf16
cudnn_benchmark = True
cuda_launch_blocking = False
pin_memory = True
persistent_workers = True
prefetch_factor = 2
grad_clip_norm = 0.5

# === AMP 稳定性 ===
amp_init_scale = 2048
amp_growth_interval = 12000
amp_backoff_factor = 0.5
overflow_patience = 2
lr_overflow_decay = 0.7
min_lr = 0.0000005
overflow_lr_decay_cooldown = 80
overflow_log_interval = 20
amp_recovery_steps = 256

# === 保存策略 ===
checkpoint_psnr_tolerance = 0.0001
checkpoint_blind_l1_tolerance = 0.000001

[network]
in_channels = 1
dim = 80
ds_kernel_size = 3
us_kernel_size = 3
num_RDB = 16
growth_rate = 18
num_dense_layer = 4
num_flow = 5
num_FRMA = 3
num_transformer_block = 2
num_heads = 5
LayerNorm_type = WithBias
ffn_expansion_factor = 2.66
bias = True

[validation]
val_period = 5

[fusion]
base_alpha = 0.8
base_beta = 0.2
blind_res_scale = 1.0
blind_infer_threshold = 0.10

[test]
custom_path = ./data/test_blur
test_mask_csv = ./data/test_mask/001/blind_pixel_coords.csv

[loss]
# Stage1 仅使用 recon / hr_warp / flow / D_TA
lr_warping_loss_weight = 0.1
hr_warping_loss_weight = 0.1
flow_loss_weight = 0.1
D_TA_loss_weight = 0.1
R_TA_loss_weight = 0.1
Net_D_weight = 0.1
flow_loss_scale = 10.0

# Stage2 参数 (Stage1 不使用但保持兼容)
blind_restore_loss_weight = 0.6
blind_res_loss_weight = 2.0
blind_mask_threshold = 0.025
restoration_loss_weight = 1.0

# smart_recon
smart_blind_l2_scale = 1000.0
smart_blind_topk_frac = 0.005

# 盲元正则
blind_boundary_loss_weight = 1.0
blind_gate_tv_weight = 0.01
blind_gate_sparsity_weight = 0.0
boundary_dilate = 3

# 增强损失 (Stage1 全部置零)
charbonnier_eps = 0.001
ssim_loss_weight = 0.0
blind_ssim_loss_weight = 0.0
grad_loss_weight = 0.0
blind_fft_loss_weight = 0.0
