[experiment]
seed = 1234

[training]
dataset_path = ./data
save_dir = ./results/FMA-Net_BlindPixel_stage2
# 加载 Stage1 最优 Net_D 权重
stage1_pretrained_dir = ./results/FMA-Net_BlindPixel_stage1
log_dir = ./results/log_dir

gpu = 0
# RTX 6000 Pro 48GB: Stage2 同时训练 Net_D + Net_R + 增强损失
# 实测 batch=4 OOM，batch=2 安全
nThreads = 16
batch_size = 2

# === Stage2 LR 调度 ===
# Net_D 已预训练，Net_R 从头学 → 用较低初始 LR 避免破坏 Net_D
# 前 80 epoch 保持 base LR，之后 cosine 退火
lr = 0.00005
lr_drop_epoch = 80
lr_after_drop = 0.00005
lr_dynamic_after_drop = True
dynamic_min_lr = 0.000001
num_epochs = 600
finetuning = False
need_patch = True
save_train_img = False
patch_size = 128
scale = 1
stage = 2
num_seq = 5

# === 训练策略 ===
warmup_epochs = 5
# torch.compile 与模型内部 backwarp 缓存字典冲突，暂关闭
use_compile = False
grad_accum_steps = 1

# === 混合精度 ===
use_amp = True
amp_dtype = bf16
cudnn_benchmark = True
cuda_launch_blocking = False
pin_memory = True
persistent_workers = True
prefetch_factor = 2
grad_clip_norm = 0.5

# === AMP 稳定性 ===
amp_init_scale = 2048
amp_growth_interval = 12000
amp_backoff_factor = 0.5
overflow_patience = 2
lr_overflow_decay = 0.7
min_lr = 0.0000005
overflow_lr_decay_cooldown = 80
overflow_log_interval = 20
amp_recovery_steps = 256

# === 保存策略 ===
checkpoint_psnr_tolerance = 0.0001
checkpoint_blind_l1_tolerance = 0.000001

[network]
in_channels = 1
dim = 80
ds_kernel_size = 3
us_kernel_size = 3
num_RDB = 16
growth_rate = 18
num_dense_layer = 4
num_flow = 5
num_FRMA = 3
num_transformer_block = 2
num_heads = 5
LayerNorm_type = WithBias
ffn_expansion_factor = 2.66
bias = True

[validation]
val_period = 5

[fusion]
# 可学习融合参数初始值
# alpha → sigmoid → [0,1]: DUF(邻帧补偿) 权重，高值 = 更多依赖邻帧
# beta  → sigmoid → [0,1]: Res(自身重建) 权重，高值 = 更多依赖自身
# 初始偏重 DUF(0.8)，训练中自动调整
base_alpha = 0.8
base_beta = 0.2
# blind_res_scale → softplus → (0, ∞): 盲元残差强度
blind_res_scale = 1.0
# 推理时盲元判定阈值（无 GT）
blind_infer_threshold = 0.10

[test]
custom_path = ./data/test_blur
test_mask_csv = ./data/test_mask/001/blind_pixel_coords.csv

[loss]
# === 基础损失权重 ===
lr_warping_loss_weight = 0.1
hr_warping_loss_weight = 0.1
flow_loss_weight = 0.1
D_TA_loss_weight = 0.1
R_TA_loss_weight = 0.1
Net_D_weight = 0.1
flow_loss_scale = 10.0

# === 盲元专项损失 ===
# restoration: 非盲区 L1 (Charbonnier)，保护正常像素不被误修改
restoration_loss_weight = 1.0
# blind_restore: 盲区输出 vs GT，盲元修复主驱动
blind_restore_loss_weight = 0.6
# blind_res: 盲区残差分支独立监督，辅助收敛
blind_res_loss_weight = 1.0
# 盲元判定阈值 (可学习参数初始值)
blind_mask_threshold = 0.025

# === smart_recon (Net_D 的重建损失) ===
smart_blind_l2_scale = 1000.0
smart_blind_topk_frac = 0.005

# === 盲元边界 / Gate 正则 (防止修复溢出) ===
# boundary: 边界区域输出接近 base_output，避免溢出替换
blind_boundary_loss_weight = 0.5
# gate TV: gate 平滑性约束
blind_gate_tv_weight = 0.01
# gate sparsity: 通常关闭，设为 0
blind_gate_sparsity_weight = 0.0
# 边界膨胀核大小
boundary_dilate = 3

# === 增强损失函数 (关键新增) ===
# Charbonnier 平滑系数: 越小越接近 L1，越大越平滑 → 1e-3 接近 L1
charbonnier_eps = 0.001

# SSIM 损失 (全图结构相似度)
# 注意: 1-SSIM 量级在 0.001~0.1 之间，权重 0.5 使该项贡献 ~0.01，作为辅助约束
ssim_loss_weight = 0.5

# 盲元区域 SSIM (针对性约束盲区结构恢复)
# 盲区 1-SSIM 量级较高 (~0.2)，权重 0.5 使该项贡献 ~0.1
blind_ssim_loss_weight = 0.5

# Sobel 梯度损失 (边缘锐度)
# 量级 ~0.5-1.0，权重 0.05 使该项贡献 ~0.03-0.05，约为 restoration 的 5-10%
grad_loss_weight = 0.05

# 盲元频域损失 (FFT 高频约束)
# 量级 ~5-10，权重 0.005 使该项贡献 ~0.03-0.05，防止该项主导训练
blind_fft_loss_weight = 0.005
